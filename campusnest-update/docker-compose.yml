# Runs the API against PostgreSQL. For the zero-setup SQLite mode just use
# `uvicorn backend.main:app --reload` instead (see README).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campusnest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      USE_SQLITE: "false"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/campusnest
      SECRET_KEY: change-me-in-production
      DEBUG: "true"
      DEMO_OTP: "1234"
      SEED_DEMO_DATA: "true"
      ALLOWED_ORIGINS: http://localhost:5173,https://campus-nest.netlify.app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
